<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Amazon with AI - 3D Try-On</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .main-container {
      width: 90%;
      max-width: 1200px;
      display: flex;
      gap: 40px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }
    .model-box {
      flex: 2;
      background-color: #1e1e1e;
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 500px;
      position: relative;
      overflow: hidden;
    }
    canvas#threeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
    .spinner {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 2;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 15px;
    }
    .sidebar h2 {
      font-size: 1.6rem;
      margin-bottom: 10px;
      color: #333;
    }
    .category-btn {
      padding: 12px 20px;
      background-color: #e0e0e0;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .category-btn:hover {
      background-color: #c5c5c5;
    }
    .upload-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    .upload-form input[type="file"] {
      padding: 6px;
    }
    .upload-form input[type="submit"] {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .upload-form input[type="submit"]:hover {
      background-color: #0056b3;
    }
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }
      .model-box {
        width: 100%;
        height: 400px;
      }
      .sidebar {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="model-box" id="modelContainer">
      <!-- <div class="spinner" id="loader"></div> -->
      <canvas id="threeCanvas"></canvas>
    </div>

    <div class="sidebar">
      <h2>Dress Categories</h2>
      <button class="category-btn">👕 T-Shirts</button>
      <button class="category-btn">👔 Formal Shirts</button>
      <button class="category-btn">👖 Jeans</button>
      <button class="category-btn">🧥 Jackets</button>
      <button class="category-btn">👗 Dresses</button>
      <button class="category-btn">👘 Ethnic Wear</button>
      <button class="category-btn">🩳 Shorts</button>
      <button class="category-btn">🧣 Winter Wear</button>

      <!-- Upload Form -->
      <!-- <form class="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
        <label for="modelFile"><strong>Upload Your 3D Model</strong></label>
        <input type="file" name="modelFile" accept=".glb" required />
        <input type="submit" value="Submit and View Model" />
      </form>
    </div>
  </div> -->

  <!-- Load Three.js and GLTFLoader -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.getElementById('threeCanvas');
    const loaderElement = document.getElementById('loader');
    const modelContainer = document.getElementById('modelContainer');

    // Canvas sizing
    canvas.width = modelContainer.clientWidth;
    canvas.height = modelContainer.clientHeight;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      45,
      modelContainer.clientWidth / modelContainer.clientHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(modelContainer.clientWidth, modelContainer.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(hemiLight);
    scene.add(ambientLight);

    // Orbit Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;

    // Load GLTF Model
    const loader = new GLTFLoader();
    loader.load(
      '/static/uploads/smplx_model.glb',
      (gltf) => {
        loaderElement.style.display = 'none';
        gltf.scene.scale.set(1, 1, 1);
        gltf.scene.position.set(0, -1.5, 0);
        scene.add(gltf.scene);
        camera.lookAt(gltf.scene.position);
        animate();
      },
      (xhr) => {
        const percentComplete = (xhr.loaded / xhr.total) * 100;
        console.log(`Loading model: ${percentComplete.toFixed(2)}%`);
      },
      (error) => {
        console.error('❌ Error loading model:', error);
        loaderElement.textContent = "Failed to load 3D model!";
      }
    );

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    // Resize handler
    window.addEventListener('resize', () => {
      const width = modelContainer.clientWidth;
      const height = modelContainer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>

</body>
</html>
