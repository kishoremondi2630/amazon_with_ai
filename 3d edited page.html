<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Preview</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            margin-top: 20px;
        }
        model-viewer {
            width: 100%;
            max-width: 600px;
            height: 500px;
            margin: auto;
            display: block;
        }
        .controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h2>3D Model Preview</h2>
    <div class="container">
        <model-viewer id="model" src="model.glb" alt="3D Model" auto-rotate camera-controls></model-viewer>
        <div class="controls">
            <button onclick="changeModel('model1.glb')">Model 1</button>
            <button onclick="changeModel('model2.glb')">Model 2</button>
            <button onclick="changeModel('model3.glb')">Model 3</button>
        </div>
    </div>
    
    <script>
        function changeModel(modelSrc) {
            const modelViewer = document.getElementById('model');
            if (modelViewer) {
                modelViewer.removeAttribute('src'); // Remove old model to force re-render
                setTimeout(() => {
                    modelViewer.setAttribute('src', modelSrc);
                }, 100); // Small delay to ensure re-render
            } else {
                console.error('Model viewer element not found');
            }
        }
    </script>
</body>
</html>
